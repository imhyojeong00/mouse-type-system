<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse Graft System</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./data.js" defer></script>
  <script src="./script.js" defer></script>
  <script src="./exhibition.js" defer></script>
</head>
<body>
  <nav id="tools" aria-label="Tools">
    <button id="xray-toggle" class="tool-x" type="button" aria-pressed="false"><span class="xray-dot"></span>X-RAY</button>
    <button class="tool" type="button" aria-pressed="false" data-panel="panel-receipt">RECEIPT</button>
    <button class="tool" type="button" aria-pressed="false" data-panel="panel-lineage">LINEAGE</button>
    <button class="tool" type="button" aria-pressed="false" data-panel="panel-graph">GRAPH</button>
  </nav>

  <div id="label"></div>

  <div id="render-stage">
    <svg id="ruler" aria-hidden="true"></svg>
    <div id="panel"></div>
    <div id="focus-frame"></div>
    <div id="marks"></div>
  </div>
  <div id="loading"></div>

  <div id="typed">
    <input type="text" id="mouse-input" placeholder="TYPE A–Z" autocomplete="off" autocorrect="off"
           autocapitalize="characters" spellcheck="false" autofocus>
  </div>

  <section id="panel-receipt" class="panel">
    <header><span>RECEIPT — every letter typed</span><button class="panel-close" type="button" data-close="panel-receipt">×</button></header>
    <pre id="receipt-text"></pre>
    <div class="panel-actions">
      <button id="receipt-print" type="button">PRINT</button>
      <button id="receipt-save" type="button">SAVE TXT</button>
    </div>
    <p class="hint">PRINT uses an 80 mm receipt layout.</p>
  </section>

  <section id="panel-lineage" class="panel wide">
    <header><span>LINEAGE MAP — year by form family</span><button class="panel-close" type="button" data-close="panel-lineage">×</button></header>
    <div id="lineage-body"></div>
  </section>

  <section id="panel-graph" class="panel wide">
    <header><span>GRAPH — how each letter responds</span><button class="panel-close" type="button" data-close="panel-graph">×</button></header>
    <div id="graph-body"></div>
  </section>
</body>
</html>
